events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        # Serve HTML reports, results, artifacts, and trace.zip files.
        location /reports/ {
            alias /test-results/;
            autoindex off;
            add_header Cache-Control "no-cache";
            add_header Accept-Ranges bytes;

            types {
                application/zip zip;
                application/json json;
                text/html html;
            }            
        }

        # Forward dashboard API requests to Express.
        location /api/ {
            proxy_pass http://report-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Forward the frontend to Express.
        location / {
            proxy_pass http://report-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}