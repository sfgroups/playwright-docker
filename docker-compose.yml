services:
  playwright-runner:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: playwright-daily-runner
    environment:
      TZ: ${TZ:-America/New_York}
      RESULTS_ROOT: /test-results
    volumes:
      - ./test-results:/test-results

  report-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: playwright-report-server
    environment:
      TZ: ${TZ:-America/New_York}
      RESULTS_ROOT: /test-results
      PORT: 3000
    volumes:
      - ./test-results:/test-results:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
